name: CI - Model Packaging & API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Model & Scaler Artifacts
      run: |
        python -c "import os; assert os.path.exists('models/tuned_xgboost.pkl'); assert os.path.exists('models/scaler.pkl'); print('Artifacts verified.')"

    - name: Run Unit and Integration Tests
      run: |
        python -m unittest discover -s tests

    - name: Smoke Test Inference CLI
      run: |
        python src/predict.py --sample legit
        python src/predict.py --sample fraud
